name: Oppdater RUH-tavle

on:
  schedule:
    - cron: "24 6,9,11,13,15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oppdater
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hent data fra Dalux og bygg sidene
        env:
          DALUX_API_KEY: ${{ secrets.DALUX_API_KEY }}
        run: |
          python fetch2.py
          python agg.py
          python build_site.py
      - name: Lagre endringer
        run: |
          git config user.name "RUH-oppdatering"
          git config user.email "actions@users.noreply.github.com"
          git add LnsIpb4xfmjasr9s7ae5xugtLI2x4Kaj/index.html I34P4eh17y95xuDE5FtIT4IBUk0tV8JW/index.html
          git diff --cached --quiet || git commit -m "Oppdater RUH-tavle"
          git pull --rebase
          git push
      - name: Samle filer for publisering
        run: |
          mkdir _site
          cp -r index.html logo-outlinet.svg robots.txt LnsIpb4xfmjasr9s7ae5xugtLI2x4Kaj I34P4eh17y95xuDE5FtIT4IBUk0tV8JW _site/
          echo '{"mimeTypes": {".html": "text/html; charset=utf-8", ".svg": "image/svg+xml; charset=utf-8", ".txt": "text/plain; charset=utf-8"}}' > _site/staticwebapp.config.json
      - name: Publiser til Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
          skip_api_build: true
